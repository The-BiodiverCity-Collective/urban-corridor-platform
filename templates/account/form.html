{% extends "_base.html" %}
{% load i18n %}

{% block content %}

<div class="flex min-h-full items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
  <div class="w-full max-w-sm space-y-10">
    <div>
      <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900">
        {{ _("Edit your account") }}
      </h2>
    </div>
    <form method="POST" class="space-y-6">
      {% csrf_token %}

      <div>
        <div class="flex items-center justify-between">
          <label for="name" class="block text-sm/6 font-medium text-gray-900">{{ _("Your name") }}</label>
        </div>
        <div class="mt-2">
          <input id="name" type="text" name="name" required autocomplete="name" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6" value="{{ request.user.first_name }}">
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label for="email" class="block text-sm/6 font-medium text-gray-900">{{ _("E-mail") }}</label>
        </div>
        <div class="mt-2">
          <input id="email" type="email" name="email" required autocomplete="email" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6" value="{{ request.user.email }}">
        </div>
      </div>


      <div>
        <div class="flex items-center justify-between">
          <label for="password" class="block text-sm/6 font-medium text-gray-900">{{ _("Change your password") }}</label>
        </div>
        <div class="mt-2">
          <input id="password" type="password" name="password" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6" value="{{ request.POST.password }}">
        </div>
      </div>

      <div>
        <button type="submit" class="flex w-full justify-center btn-green">{{ _("Save changes") }}</button>
      </div>
    </form>

  </div>
</div>

{% endblock %}
